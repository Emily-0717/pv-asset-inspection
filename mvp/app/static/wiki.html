<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>知识图谱 · 晨曦光伏 MVP</title>
<style>
  :root { --ink:#243b32; --muted:#6b7d72; --bg:#fbfaf3; --line:#cfd9cb; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--ink);
         font:14px/1.6 "Microsoft YaHei", system-ui, sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  .hint { color:var(--muted); font-size:12px; margin-bottom:16px; }
  #wrap { display:flex; gap:16px; align-items:flex-start; }
  svg { background:#fff; border:1px solid var(--line); border-radius:8px; flex:1; min-width:0; }
  aside { width:260px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; }
  .k { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; margin:2px 4px 2px 0; color:#fff; }
  .cause { background:#b4533f; } .evidence { background:#3f6b8a; }
  .action { background:#5a7d4a; } .metric { background:#8a6b3f; }
  .component { background:#6b5a8a; } .role { background:#4a6b6b; }
  ul { padding-left:16px; margin:8px 0; }
  li { margin:4px 0; word-break:break-all; }
  .err { color:#b4533f; }
  code { background:#f1f0e8; padding:1px 4px; border-radius:4px; }
</style>
</head>
<body>
<h1>晨曦光伏 · 知识图谱</h1>
<div class="hint">只读视图；URL 需带 <code>?api_key=</code>。合成数据，仅供人工核对。</div>
<div id="wrap">
  <svg id="canvas" viewBox="0 0 820 560" preserveAspectRatio="xMidYMid meet"></svg>
  <aside>
    <div id="stats" class="hint">加载中…</div>
    <div id="detail"><p class="hint">点击节点查看关系。</p></div>
    <div style="margin-top:12px">
      <span class="k cause">原因</span><span class="k evidence">证据</span>
      <span class="k action">动作</span>
    </div>
  </aside>
</div>
<script>
// 浏览器打不了自定义头，所以 key 从 query 取；只读接口，泄露风险由租户 Key 轮换兜底
const key = new URLSearchParams(location.search).get("api_key") || "";
const NS = "http://www.w3.org/2000/svg";
const canvas = document.getElementById("canvas");
const stats = document.getElementById("stats");
const detail = document.getElementById("detail");

function el(name, attrs) {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  return node;
}

async function load() {
  if (!key) { stats.innerHTML = '<span class="err">缺少 api_key 参数</span>'; return; }
  const res = await fetch("/wiki/graph?api_key=" + encodeURIComponent(key));
  const body = await res.json();
  if (!body.ok) { stats.innerHTML = '<span class="err">' + body.error.msg + "</span>"; return; }
  render(body.data);
}

function render(graph) {
  const nodes = graph.nodes, edges = graph.edges;
  stats.textContent = `节点 ${graph.stats.nodes} · 关系 ${graph.stats.edges}`;
  const cx = 410, cy = 280;
  // 无布局库：按 kind 分环排布，原因在内环，证据/动作在外环
  const ring = { cause: 150, evidence: 250, action: 250, metric: 280, component: 280, role: 280 };
  const byKind = {};
  nodes.forEach(n => (byKind[n.kind] = byKind[n.kind] || []).push(n));
  const pos = {};
  Object.entries(byKind).forEach(([kind, list]) => {
    list.forEach((n, i) => {
      const angle = (Math.PI * 2 * i) / list.length + (kind === "cause" ? 0 : 0.4);
      const r = ring[kind] || 260;
      pos[n.node_id] = { x: cx + r * Math.cos(angle), y: cy + r * 0.72 * Math.sin(angle) };
    });
  });

  edges.forEach(e => {
    const a = pos[e.src_id], b = pos[e.dst_id];
    if (!a || !b) return;
    canvas.appendChild(el("line", {
      x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      stroke: "#cfd9cb", "stroke-width": 1.2, "data-src": e.src_id, "data-dst": e.dst_id
    }));
  });

  nodes.forEach(n => {
    const p = pos[n.node_id];
    const g = el("g", { "data-id": n.node_id, style: "cursor:pointer" });
    g.appendChild(el("circle", { cx: p.x, cy: p.y, r: 9, fill: colorOf(n.kind), stroke: "#fff", "stroke-width": 2 }));
    const label = el("text", { x: p.x + 12, y: p.y + 4, "font-size": 12, fill: "#243b32" });
    label.textContent = n.label;
    g.appendChild(label);
    g.addEventListener("click", () => show(n, edges));
    canvas.appendChild(g);
  });
}

function colorOf(kind) {
  return { cause: "#b4533f", evidence: "#3f6b8a", action: "#5a7d4a",
           metric: "#8a6b3f", component: "#6b5a8a", role: "#4a6b6b" }[kind] || "#777";
}

function show(node, edges) {
  const rel = edges.filter(e => e.src_id === node.node_id || e.dst_id === node.node_id);
  const items = rel.map(e => `<li>${e.relation} → <code>${e.dst_id.slice(0, 12)}</code></li>`).join("");
  detail.innerHTML = `<strong>${node.label}</strong>
    <div class="hint">${node.kind} · ${node.node_id}</div>
    <p>${node.summary || "（无摘要）"}</p>
    <div>关系</div><ul>${items || "<li>无</li>"}</ul>`;
}

load();
</script>
</body>
</html>
